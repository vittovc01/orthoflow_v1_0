# Separate deployment; existing Streamlit desktop render.yaml is unchanged.
services:
  - type: web
    name: orthoflow-mobile
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./mobile/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://foawqtscqtwhpkbfbibj.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_AI_OCR
        value: 'true'
      - key: MOBILE_LOCAL_DEV
        value: 'false'
