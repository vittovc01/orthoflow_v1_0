name: OrthoFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orthoflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ui:
    name: Python e interfaccia
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            requirements-mobile.txt
            requirements-mobile.lock
      - run: python -m pip install -r requirements-ci.txt
      - name: Compilazione di tutti i file Python
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Test scarico e filtro produttori
        run: python tests/test_scarico_form.py
      - name: Smoke test delle pagine reali
        run: python -m pytest -q tests/test_pages_smoke.py
      - name: Accessi e API app mobile
        run: python -m pytest -q tests/test_mobile_api.py tests/test_home_data.py tests/test_deployment_health.py tests/test_document_compression.py tests/test_cloud_protection.py
      - name: Browser per test mobile
        run: python -m playwright install --with-deps chromium
      - name: Menu su telefono e desktop
        env:
          MOBILE_PREVIEW_DIR: artifacts/mobile
        run: python -m pytest -q tests/test_mobile_navigation.py tests/test_mobile_app_browser.py tests/test_home_browser.py

      - name: Anteprime app mobile con dati dimostrativi
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orthoflow-mobile-preview
          path: artifacts/mobile
          retention-days: 7

  database:
    name: Magazzino e prezzi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: orthoflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orthoflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Test SQL su database temporaneo
        run: bash tests/run_database_tests.sh

      - name: Prova ripristino backup su database isolato
        run: bash tests/backup_restore.sh
