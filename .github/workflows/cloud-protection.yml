name: Protezione cloud OrthoFlow
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orthoflow-cloud-protection
  cancel-in-progress: false
jobs:
  backup:
    if: vars.CLOUD_BACKUP_ENABLED == 'true'
    name: Backup cifrato dati e documenti
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-mobile.lock
      - name: Client compatibile con PostgreSQL 17
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Esporta, cifra e verifica
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python scripts/cloud_backup.py --output orthoflow-backup.enc
      - name: Conserva esclusivamente archivio cifrato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orthoflow-encrypted-backup-${{ github.run_id }}
          path: orthoflow-backup.enc
          retention-days: 30
          if-no-files-found: error
  capacity:
    if: vars.CLOUD_MONITOR_ENABLED == 'true'
    name: Spazio cloud disponibile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-mobile.lock
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLOUD_DATABASE_LIMIT_BYTES: ${{ vars.CLOUD_DATABASE_LIMIT_BYTES }}
          CLOUD_FILE_LIMIT_BYTES: ${{ vars.CLOUD_FILE_LIMIT_BYTES }}
        run: python scripts/check_cloud.py
